[project]
name = "logo-wizard"
version = "0.0.1"
description = "Local text-to-title-logo generator trained on synthetic data"
requires-python = ">=3.11"
dependencies = [
    "uharfbuzz",
    "skia-python",
    "pillow",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
train = ["torch", "pytesseract"]
app = ["fastapi", "uvicorn", "onnxruntime"]
dev = ["pytest", "httpx"]

[project.scripts]
logo-wizard-corpus = "logo_wizard.corpus.build:main"
logo-wizard-fonts = "logo_wizard.fonts.fetch:main"
logo-wizard-render = "logo_wizard.render.cli:main"
logo-wizard-app = "logo_wizard.app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logo_wizard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
