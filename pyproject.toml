[project]
name = "logo-wizard"
version = "0.0.1"
description = "Local text-to-title-logo generator trained on synthetic data"
requires-python = ">=3.11"
dependencies = [
    "uharfbuzz",
    "freetype-py",
    "skia-python",
    "pillow",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
train = ["torch", "pytesseract"]
app = ["fastapi", "uvicorn", "onnxruntime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logo_wizard"]
