name: windows release

# Push a tag like v0.1.0 to build the Windows app and publish a GitHub release.
# Run it by hand from the Actions tab to get the build as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: local/fonts
          key: fonts-${{ hashFiles('data/fonts/manifest.csv') }}
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        env:
          LW_PYTHON: python
        run: packaging/build_windows.ps1
      - name: Smoke test the build
        shell: pwsh
        run: |
          $p = Start-Process dist\LogoWizard\LogoWizard.exe -ArgumentList "--no-browser","--port","8799" -PassThru
          $r = $null
          foreach ($i in 1..60) {
            try { $r = Invoke-RestMethod -Uri http://127.0.0.1:8799/api/status; break } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $r) { Stop-Process -Id $p.Id; throw "The built app did not start" }
          Write-Host "Started: $($r | ConvertTo-Json -Compress)"
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8799/api/generate -ContentType "application/json" -Body '{"text":"The Iron Comet","count":2}'
          Stop-Process -Id $p.Id
          if ($r.candidates.Count -ne 2) { throw "The built app did not return candidates" }
      - uses: actions/upload-artifact@v4
        with:
          name: LogoWizard-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
      - name: Release notes
        shell: pwsh
        run: |
          # This version's section of CHANGELOG.md, from its heading to the next one.
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $next = ($lines | Select-Object -Skip $start | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $end = if ($next) { $start + $next - 2 } else { $lines.Count - 1 }
          $lines[$start..$end] | Set-Content release-notes.md
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
          body_path: release-notes.md
