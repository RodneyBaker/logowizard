# Curated palettes for the title grammar.
# Roles: fill (1 to 3 gradient stops, top to bottom), outlines (innermost first),
# extrude (3D side), shadow, halftone (dot color), inline (thin inner highlight).
# moods match the font catalog tags so the grammar can pair them.

comic:
  - {name: classic-hero, moods: [comic pulp], fill: ["#FFE135", "#FF9A00"], outlines: ["#D7261E", "#111111", "#FFFFFF"], extrude: "#8C1010", shadow: "#111111", halftone: "#D7261E", inline: "#FFF6B0"}
  - {name: atomic-red, moods: [comic scifi pulp], fill: ["#FF3B30", "#B3001B"], outlines: ["#FFFFFF", "#111111", "#FFD600"], extrude: "#4A0010", shadow: "#000000", halftone: "#6B0012", inline: "#FFC2BD"}
  - {name: cosmic-blue, moods: [comic scifi], fill: ["#7FE7FF", "#1E6BFF", "#2A1B8F"], outlines: ["#FFFFFF", "#0B0B2E", "#FF2E88"], extrude: "#0B0B2E", shadow: "#000000", halftone: "#0E2A80", inline: "#E6FBFF"}
  - {name: toxic-green, moods: [comic horror scifi], fill: ["#C6FF3D", "#2DBD2D"], outlines: ["#1A1A1A", "#6A00A8", "#C6FF3D"], extrude: "#0F3D0F", shadow: "#000000", halftone: "#0F5D0F", inline: "#F2FFD0"}
