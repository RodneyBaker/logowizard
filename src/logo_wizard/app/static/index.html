<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Wizard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23d62828%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Impact,sans-serif%27 font-size=%2718%27 fill=%27%23ffd60a%27 text-anchor=%27middle%27%3ELW%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg: #f4f5f7; --panel: #ffffff; --ink: #1c1f26; --muted: #5d6472; --line: #d9dce3; --accent: #d7261e; --tile: #e6e8ec; --dark-tile: #262a33; --good: #1f8a4c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --panel: #1e2128; --ink: #eceef2; --muted: #9aa1ad; --line: #30343d; --tile: #2a2e36; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: baseline; gap: 18px; padding: 16px 24px 4px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  nav { display: flex; gap: 4px; }
  nav button { border: 0; background: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; }
  nav button.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  #model-status { margin-left: auto; color: var(--muted); font-size: 13px; }
  form { display: grid; grid-template-columns: 2fr 1fr 1fr auto auto auto; gap: 10px; padding: 12px 24px; align-items: end; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select, button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .status { padding: 0 24px; color: var(--muted); min-height: 1.4em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; padding: 12px 24px 40px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card.picked { box-shadow: 0 0 0 2px var(--accent); }
  .art { aspect-ratio: 512 / 320; background: var(--tile); display: grid; place-items: center; cursor: pointer; }
  .dark .art, .art.dark { background: var(--dark-tile); }
  .art img { width: 100%; height: 100%; object-fit: contain; }
  .bar { display: flex; gap: 6px; padding: 8px; align-items: center; }
  .bar span { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar button { padding: 4px 9px; font-size: 13px; }
  .bar button.voted { border-color: var(--good); color: var(--good); }
  .bar button.voted.down { border-color: var(--accent); color: var(--accent); }
  #editor { display: none; grid-template-columns: minmax(0, 3fr) minmax(260px, 1fr); gap: 16px; padding: 0 24px 24px; }
  #editor.open { display: grid; }
  #editor .art { aspect-ratio: 1024 / 640; border-radius: 12px; border: 1px solid var(--line); cursor: default; }
  .controls { display: grid; gap: 8px; align-content: start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .controls .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .controls .export { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  .controls input[type=range] { padding: 0; }
  .check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink); }
  #blind { display: none; padding: 12px 24px 40px; }
  #blind.open { display: block; }
  #blind .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  #blind .art { border-radius: 12px; border: 1px solid var(--line); }
  #blind p { color: var(--muted); margin: 4px 0; }
  @media (max-width: 820px) {
    form { grid-template-columns: 1fr 1fr; } form label:first-child { grid-column: 1 / -1; }
    #editor.open { grid-template-columns: 1fr; } #blind .pair { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Logo Wizard</h1>
  <nav><button class="on" data-tab="create">Create</button><button data-tab="blind">Blind test</button></nav>
  <span id="model-status"></span>
</header>

<section id="create">
  <form id="form">
    <label>Title <input id="text" required placeholder="The Iron Comet" autofocus></label>
    <label>Style words <input id="words" placeholder="sci-fi, gothic, western..."></label>
    <label>Subtitle or author <input id="subtitle" placeholder="optional"></label>
    <label>Style
      <select id="style"><option value="">Auto</option><option value="comic">Comic</option><option value="novel">Novel</option></select>
    </label>
    <label>Ideas from
      <select id="source"><option value="auto">Best available</option><option value="mix">Model and rules</option><option value="model">Model only</option><option value="rules">Rules only</option></select>
    </label>
    <button class="primary" type="submit">Generate</button>
  </form>
  <div class="status" id="status"></div>
  <div id="editor">
    <div class="art" id="editor-art"><img id="editor-img" alt=""></div>
    <div class="controls">
      <label>Font <select id="f-font"></select></label>
      <label>Palette <select id="f-palette"></select></label>
      <div class="row">
        <label>Layout <select id="f-arrangement"></select></label>
        <label>Letters <select id="f-case"></select></label>
      </div>
      <div class="row">
        <label>Warp <select id="f-warp"></select></label>
        <label>Warp amount <input id="f-warp_amount" type="range" min="0" max="1" step="0.05"></label>
      </div>
      <div class="row">
        <label>Fill <select id="f-fill_mode"></select></label>
        <label>Texture <select id="f-texture"></select></label>
      </div>
      <div class="row">
        <label>Outlines <select id="f-outlines"><option value="0">None</option><option value="1">One</option><option value="2">Two</option><option value="3">Three</option></select></label>
        <label>Letter spacing <input id="f-tracking" type="range" min="-0.02" max="0.3" step="0.01"></label>
      </div>
      <div class="row">
        <label>3D depth <input id="f-extrude_depth" type="range" min="0" max="24" step="1"></label>
        <label>Shadow <input id="f-shadow" type="range" min="0" max="10" step="0.5"></label>
      </div>
      <div class="row">
        <label>Halftone <input id="f-halftone" type="range" min="0" max="1" step="0.05"></label>
        <label>Tilt <input id="f-tilt" type="range" min="-10" max="10" step="1"></label>
      </div>
      <label class="check"><input type="checkbox" id="f-inline"> Inline highlight</label>
      <label class="check" id="stylize-wrap" hidden><input type="checkbox" id="stylize"> Finish with the stylizer (slow without a GPU)</label>
      <div class="export">
        <button type="button" data-size="512">PNG 512</button>
        <button type="button" data-size="1024">PNG 1024</button>
        <button type="button" data-size="2048">PNG 2048</button>
        <button type="button" id="save-spec">Spec JSON</button>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section id="blind">
  <p>Two takes on the same title: one from the trained layout model, one from the hand-written rules. Click the one you prefer. Your picks also count as thumbs-up for fine-tuning.</p>
  <p id="tally"></p>
  <div class="pair">
    <div class="art" id="blind-a"><img alt="Option A"></div>
    <div class="art" id="blind-b"><img alt="Option B"></div>
  </div>
  <p id="blind-title"></p>
</section>

<script>
const $ = (id) => document.getElementById(id);
const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const OUTLINE_WIDTHS = { comic: [4, 5, 3.5], novel: [1.5, 1.5, 1.5] };
let current = null, currentCard = null, lastWords = '', options = null, renderTimer = null, renderSeq = 0, pair = null;

function lightLogo(img) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 40;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, 64, 40);
  const d = g.getImageData(0, 0, 64, 40).data; let lum = 0, a = 0;
  for (let i = 0; i < d.length; i += 4) { const w = d[i + 3] / 255; lum += w * (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255; a += w; }
  return a > 0 && lum / a > 0.6;
}
function showImage(img, src, art) { img.onload = () => art.classList.toggle('dark', lightLogo(img)); img.src = src; }
const describe = (s) => [s.font.replace(/-\d+$/, ''), s.palette, s.warp !== 'none' ? s.warp : s.arrangement].join(' · ');

async function loadStatus() {
  const s = await (await fetch('/api/status')).json();
  const parts = [s.layout ? 'Layout: ' + s.layout : 'Layout: rules only (no model trained yet)'];
  if (s.stylizer) { parts.push('Stylizer: ' + s.stylizer); $('stylize-wrap').hidden = false; }
  $('model-status').textContent = parts.join(' · ');
}

async function loadOptions() {
  options = await (await fetch('/api/options')).json();
  const fill = (id, values, label = (v) => v) => { $(id).replaceChildren(...values.map((v) => new Option(label(v), v.id || v.name || v))); };
  fill('f-font', options.fonts, (f) => `${f.family} ${f.weight}`);
  fill('f-palette', options.palettes, (p) => `${p.name} (${p.family})`);
  fill('f-arrangement', options.arrangements); fill('f-case', options.cases); fill('f-warp', options.warps);
  fill('f-fill_mode', options.fill_modes); fill('f-texture', options.textures);
}

function toControls(s) {
  for (const k of ['font', 'palette', 'arrangement', 'case', 'warp', 'fill_mode', 'texture']) $('f-' + k).value = s[k];
  for (const k of ['warp_amount', 'tracking', 'extrude_depth', 'shadow', 'halftone', 'tilt']) $('f-' + k).value = s[k];
  $('f-outlines').value = s.outlines.length; $('f-inline').checked = s.inline;
}

function fromControls() {
  const s = { ...current };
  for (const k of ['font', 'palette', 'arrangement', 'case', 'warp', 'fill_mode', 'texture']) s[k] = $('f-' + k).value;
  for (const k of ['warp_amount', 'tracking', 'extrude_depth', 'shadow', 'halftone', 'tilt']) s[k] = parseFloat($('f-' + k).value);
  const n = parseInt($('f-outlines').value, 10);
  const widths = OUTLINE_WIDTHS[s.style] || OUTLINE_WIDTHS.comic;
  s.outlines = Array.from({ length: n }, (_, i) => current.outlines[i] || widths[i]);
  s.inline = $('f-inline').checked;
  return s;
}

async function renderBlob(spec, width, height, stylize = false) {
  const res = await post('/api/render', { spec, width, height, stylize });
  if (!res.ok) throw new Error((await res.json()).detail || 'Render failed');
  return await res.blob();
}

function refreshEditor() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(async () => {
    const seq = ++renderSeq;
    current = fromControls();
    const stylize = $('stylize').checked;
    if (stylize) $('status').textContent = 'Stylizing...';
    try {
      const blob = await renderBlob(current, 1024, 640, stylize);
      if (seq === renderSeq) showImage($('editor-img'), URL.createObjectURL(blob), $('editor-art'));
      if (stylize) $('status').textContent = '';
    } catch (err) { $('status').textContent = err.message; }
  }, 120);
}

function openEditor(spec, card) {
  current = JSON.parse(JSON.stringify(spec));
  document.querySelectorAll('.card.picked').forEach((c) => c.classList.remove('picked'));
  currentCard = card; card.classList.add('picked');
  toControls(current); $('editor').classList.add('open'); refreshEditor();
  $('editor').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function vote(spec, value, source, buttons, pressed) {
  await post('/api/feedback', { spec, words: lastWords, vote: value, source });
  buttons.forEach((b) => b.classList.remove('voted', 'down'));
  pressed.classList.add('voted'); if (value < 0) pressed.classList.add('down');
}

function card(c) {
  const el = document.createElement('div'); el.className = 'card';
  const art = document.createElement('div'); art.className = 'art'; art.title = 'Refine and export';
  const img = new Image(); img.alt = c.spec.text; art.appendChild(img); el.appendChild(art);
  showImage(img, 'data:image/png;base64,' + c.png, art);
  art.onclick = () => openEditor(c.spec, el);
  const bar = document.createElement('div'); bar.className = 'bar';
  const info = document.createElement('span'); info.textContent = describe(c.spec); info.title = c.source === 'model' ? 'from the layout model' : 'from the rules';
  const up = document.createElement('button'); up.type = 'button'; up.textContent = '👍'; up.title = 'More like this';
  const down = document.createElement('button'); down.type = 'button'; down.textContent = '👎'; down.title = 'Less like this';
  up.onclick = () => vote(c.spec, 1, c.source, [up, down], up);
  down.onclick = () => vote(c.spec, -1, c.source, [up, down], down);
  bar.append(info, up, down); el.appendChild(bar);
  return el;
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('status').textContent = 'Drawing...';
  lastWords = $('words').value;
  const body = { text: $('text').value, words: lastWords, subtitle: $('subtitle').value, style: $('style').value || null, source: $('source').value, count: 12 };
  const res = await post('/api/generate', body);
  if (!res.ok) { $('status').textContent = (await res.json()).detail || 'Something went wrong.'; return; }
  const data = await res.json();
  $('grid').replaceChildren(...data.candidates.map(card));
  const fromModel = data.candidates.filter((c) => c.source === 'model').length;
  $('status').textContent = `${data.candidates.length} ${data.style} candidates` + (fromModel ? ` (${fromModel} from the model)` : '') + '. Click one to refine and export.';
});

document.querySelectorAll('.controls select, .controls input').forEach((el) => el.addEventListener('input', refreshEditor));

document.querySelectorAll('.export button[data-size]').forEach((b) => b.addEventListener('click', async () => {
  const w = parseInt(b.dataset.size, 10), h = Math.round(w * 0.625);
  try {
    const blob = await renderBlob(fromControls(), w, h, $('stylize').checked);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = current.text.replace(/[^\w]+/g, '_').toLowerCase() + `_${w}.png`; a.click();
    if (currentCard) post('/api/feedback', { spec: fromControls(), words: lastWords, vote: 1, source: 'export' });
  } catch (err) { $('status').textContent = err.message; }
}));

$('save-spec').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(fromControls(), null, 2)], { type: 'application/json' }));
  a.download = current.text.replace(/[^\w]+/g, '_').toLowerCase() + '.json'; a.click();
});

async function nextPair() {
  $('blind-title').textContent = 'Drawing...';
  const res = await fetch('/api/blind');
  if (!res.ok) { $('blind-title').textContent = (await res.json()).detail; return; }
  pair = await res.json();
  showImage($('blind-a').querySelector('img'), 'data:image/png;base64,' + pair.a, $('blind-a'));
  showImage($('blind-b').querySelector('img'), 'data:image/png;base64,' + pair.b, $('blind-b'));
  $('blind-title').textContent = `"${pair.text}"` + (pair.words ? ` with style words "${pair.words}"` : '');
}
async function showTally() {
  const t = await (await fetch('/api/blind/tally')).json();
  const n = t.model + t.rules;
  $('tally').textContent = n ? `So far the model won ${t.model} of ${n} picks.` : 'No picks yet.';
}
for (const side of ['a', 'b']) {
  $('blind-' + side).addEventListener('click', async () => {
    if (!pair) return;
    const id = pair.pair_id; pair = null;
    await post('/api/blind', { pair_id: id, pick: side });
    showTally(); nextPair();
  });
}

document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
  $('create').style.display = b.dataset.tab === 'create' ? '' : 'none';
  $('blind').classList.toggle('open', b.dataset.tab === 'blind');
  if (b.dataset.tab === 'blind') { showTally(); if (!pair) nextPair(); }
}));

loadStatus(); loadOptions();
</script>
</body>
</html>
